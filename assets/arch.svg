<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <style>text { font-family: -apple-system, "Segoe UI", sans-serif; }</style>
  </defs>
  <rect width="760" height="420" fill="#0d1117" rx="12"/>

  <!-- customer message -->
  <rect x="300" y="20" width="160" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="380" y="47" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Customer message</text>

  <!-- split arrow down-left and down-right -->
  <line x1="380" y1="64" x2="380" y2="74" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="74" x2="260" y2="74" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="380" y1="74" x2="500" y2="74" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="260" y1="74" x2="260" y2="110" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="74" x2="500" y2="110" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- model boxes -->
  <rect x="180" y="110" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="260" y="128" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Model A</text><text x="260" y="142" text-anchor="middle" fill="#6e7681" font-size="10">baseline</text>
  <rect x="420" y="110" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="500" y="128" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Model B</text><text x="500" y="142" text-anchor="middle" fill="#6e7681" font-size="10">changed version</text>

  <!-- trace boxes -->
  <line x1="260" y1="154" x2="260" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="154" x2="500" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="180" y="200" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="260" y="218" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">scenario_N.json</text><text x="260" y="232" text-anchor="middle" fill="#6e7681" font-size="10">baseline trace</text>
  <rect x="420" y="200" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="500" y="218" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">replay_N.json</text><text x="500" y="232" text-anchor="middle" fill="#6e7681" font-size="10">replay trace</text>

  <!-- converge to diff.py -->
  <line x1="260" y1="244" x2="260" y2="254" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="500" y1="244" x2="500" y2="254" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="260" y1="254" x2="380" y2="254" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="500" y1="254" x2="380" y2="254" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="380" y1="254" x2="380" y2="285" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="285" width="160" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="380" y="303" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">diff.py</text><text x="380" y="317" text-anchor="middle" fill="#6e7681" font-size="10">classify per scenario × run</text>

  <!-- label pills -->
  <line x1="380" y1="329" x2="380" y2="355" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="90" y="365" width="130" height="28" rx="14" fill="#3fb950" opacity="0.15"/><text x="155" y="384" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">SAME</text><rect x="235" y="365" width="130" height="28" rx="14" fill="#e3b341" opacity="0.15"/><text x="300" y="384" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">VALID CHANGE</text><rect x="385" y="365" width="130" height="28" rx="14" fill="#f85149" opacity="0.15"/><text x="450" y="384" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">REGRESSION</text><rect x="530" y="365" width="130" height="28" rx="14" fill="#d2a8ff" opacity="0.15"/><text x="595" y="384" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">DIFFERENT</text>
</svg>
